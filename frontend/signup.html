<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medizy — Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>
<div class="auth-bg">
  <div class="auth-card-box">

    <div class="auth-logo">
      <img src="assets/logo.png" alt="Medizy" onerror="this.parentElement.textContent='＋'">
    </div>

    <h1>Sign-up for New Users</h1>
    <p class="auth-sub">Create your free Medizy account to get started.</p>

    <div class="auth-form-box">
      <div class="auth-input-row">
        <label>Email :</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="auth-input-row">
        <label>Password :</label>
        <input type="password" id="password" placeholder="Create a strong password">
      </div>
      <div class="auth-input-row">
        <label>Phone :</label>
        <input type="tel" id="phone" placeholder="+91 00000 00000">
      </div>
      <div class="auth-btns-center">
        <button class="btn-primary" style="flex:unset;padding:11px 40px;" onclick="handleSignup()">Create Account →</button>
      </div>
    </div>

  </div>
</div>
<script src="medizy.js"></script>
<script>
function handleSignup(){
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const phone    = document.getElementById("phone").value.trim();
    if(!email||!password||!phone){ showToast("Please fill all fields"); return; }
    localStorage.setItem("userEmail",email);
    localStorage.setItem("userPassword",password);
    localStorage.setItem("userPhone",phone);
    window.location.href = "otp.html";
}
</script>
</body>
</html>

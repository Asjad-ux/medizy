<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBot 2.0 | Medizy</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .user-msg {
            background: #e1f5fe;
            align-self: flex-end;
            padding: 10px;
            border-radius: 10px 10px 0 10px;
            margin: 5px;
            max-width: 80%;
        }

        .bot-msg {
            background: #f1f1f1;
            align-self: flex-start;
            padding: 10px;
            border-radius: 10px 10px 10px 0;
            margin: 5px;
            max-width: 80%;
            line-height: 1.5;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
            background: #fff;
        }

        .chat-container {
            max-width: 600px;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="brand" onclick="go('dashboard.html')" style="cursor:pointer;">
        <img src="assets/logo.png" alt="Logo">
        <div>
            <h2>Medizy</h2>
            <p>AI-powered platform that instantly provides accurate medicine information.</p>
        </div>
    </div>

    <div class="actions">
        <input id="search" placeholder="Search Medicines from Nearby Pharmacies">
        <div class="profile" onclick="go('profile.html')">👤</div>
    </div>
</div>

<div class="layout">

    <div class="sidebar">
        <button onclick="go('prescription-upload.html')">Upload Prescription</button>
        <button onclick="go('image-search.html')">Authenticate Medicine</button>
        <button onclick="go('price-search.html')">Price Compare</button>
        <button class="active" onclick="go('chatbot.html')">Ask MediBot</button>
        <button onclick="go('pharmacy-register.html')">Register Your Pharmacy</button>
        <button onclick="go('about.html')">About</button>

        <div class="time-box" id="time"></div>
    </div>

    <div class="content">
        <h1>Ask MediBot 2.0</h1>
        <p class="subtitle">Your AI-powered health assistant connected to Medizy Database</p>

        <div class="chat-container">
            <div id="chatBox" class="chat-box">
                <div class="bot-msg">
                    👋 Hello! I am Medibot. I can check medicine stock, prices, and guide you on Medizy. How can I help?
                </div>
            </div>

            <div class="chat-input">
                <input id="userInput" type="text" placeholder="Ask about medicines, availability, or features...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
// ---------------- NAVIGATION ----------------
function go(page){
    window.location.href = page;
}

// ---------------- SEARCH ----------------
document.getElementById("search").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        localStorage.setItem("searchQuery", this.value);
        window.location.href = "search.html";
    }
});

// ---------------- CLOCK ----------------
function updateTime(){
    const now = new Date();
    const day = now.toLocaleDateString(undefined, { weekday: 'long' });

    document.getElementById("time").innerText =
        now.toLocaleTimeString() + "\n" +
        day + "\n" +
        now.toLocaleDateString();
}
setInterval(updateTime, 1000);
updateTime();

// ---------------- USER ID (IMPORTANT 🔥) ----------------
function generateUserId() {
    const id = "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("user_id", id);
    return id;
}

function getUserId() {
    return localStorage.getItem("user_id") || generateUserId();
}

// ---------------- MEDIBOT ----------------
async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if (message === "") return;

    // Show user message
    chatBox.innerHTML += `<div class="user-msg"><b>You:</b> ${message}</div>`;
    input.value = "";

    // Smart thinking message
    let thinkingText = "🤖 Medibot is thinking...";
    if (message.toLowerCase().includes("medicine") || message.toLowerCase().includes("stock")) {
        thinkingText = "💊 Checking medicine availability...";
    }

    const tempId = "bot-" + Date.now();
    chatBox.innerHTML += `<div class="bot-msg" id="${tempId}"><i>${thinkingText}</i></div>`;

    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch('http://127.0.0.1:5000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: message,
                user_id: getUserId()
            })
        });

        const data = await response.json();
        const botDiv = document.getElementById(tempId);

        if (data.status === "success") {
            botDiv.innerHTML = `<b>Medibot:</b><br>${data.reply.replace(/\n/g, "<br>")}`;
        } else {
            botDiv.innerHTML = "⚠️ Error fetching response.";
        }

    } catch (error) {
        console.error("Connection Error:", error);
        document.getElementById(tempId).innerHTML =
            "❌ Connection Error: Make sure Flask server is running on port 5000.";
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

// ENTER key support
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>

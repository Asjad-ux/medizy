<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medizy — Ask MediBot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('dashboard.html')">
    <div class="brand-icon"><img src="assets/logo.png" onerror="this.parentElement.textContent='＋'"></div>
    <div class="brand-text"><h2>Medizy</h2><p>AI-powered platform for accurate medicine information.</p></div>
  </div>
  <div class="topbar-actions">
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" style="display: none;">☰</button>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="topSearch" placeholder="Search Medicine in Nearby Stores" autocomplete="off">
      <div class="autocomplete-dropdown" id="autocompleteDropdown">
        <div class="dropdown-header" id="dropdownHeader">Suggestions</div>
        <div id="dropdownList"></div>
      </div>
    </div>
    <button class="profile-btn" onclick="go('profile.html')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </div>
</div>

<div class="layout">
  <!-- MOBILE MENU OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileMenu()"></div>

  <div class="sidebar">
    <button class="nav-item" onclick="go('dashboard.html')"><span class="nav-icon">🏠</span>Dashboard</button>
    <button class="nav-item" onclick="go('prescription-upload.html')"><span class="nav-icon">📋</span>Upload Prescription</button>
    <button class="nav-item" onclick="go('image-search.html')"><span class="nav-icon">🛡️</span>Authenticate Medicine</button>
    <button class="nav-item" onclick="go('price-search.html')"><span class="nav-icon">💲</span>Price Compare</button>
    <button class="nav-item active" onclick="go('chatbot.html')"><span class="nav-icon">🤖</span>Ask MediBot</button>
    <button class="nav-item" onclick="go('analytics.html')"><span class="nav-icon">📊</span>Analytics</button>
    <button class="nav-item" onclick="go('pharmacy-register.html')"><span class="nav-icon">🏪</span>Register Pharmacy</button>
    <button class="nav-item" onclick="go('about.html')"><span class="nav-icon">ℹ️</span>About</button>
    <div class="time-box">
      <div class="t-clock" id="clock">--:--:--</div>
      <div class="t-day" id="day">---</div>
      <div class="t-date" id="dateEl">---</div>
    </div>
  </div>

  <div class="content" style="display:flex;flex-direction:column;">
    <div class="page-header">
      <h1>Ask MediBot 2.0</h1>
      <p>Your AI-powered health assistant connected to Medizy Database</p>
    </div>

    <div class="chat-wrap" style="flex:1;min-height:0;">
      <div id="chatBox" class="chat-box">
        <div class="bot-msg">👋 Hello! I am Medibot. I can check medicine stock, prices, and guide you on Medizy. How can I help?</div>
      </div>
      <div class="chat-input-row">
        <input id="userInput" type="text" placeholder="Ask What's in your Mind...">
        <button class="chat-send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>
        </button>
        <button class="chat-clear-btn" onclick="clearChatHistory()" title="Clear Chat History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="medizy.js"></script>
<script>
initSearch("topSearch");
startClock("clock","day","dateEl");

function getUserId(){
    let id = localStorage.getItem("user_id");
    if(!id){ id = "user_" + Math.random().toString(36).substr(2,9); localStorage.setItem("user_id",id); }
    return id;
}

function getHistoryKey(){
    return "medibot_history_" + getUserId();
}

function loadChatHistory(){
    const raw = localStorage.getItem(getHistoryKey());
    try { return raw ? JSON.parse(raw) : []; } catch(e) { return []; }
}

function saveChatHistory(history){
    localStorage.setItem(getHistoryKey(), JSON.stringify(history));
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function appendChatMessage(role, text, save=true){
    const chatBox = document.getElementById("chatBox");
    const escaped = escapeHtml(text).replace(/\n/g, "<br>");
    if(role === "user"){
        chatBox.innerHTML += `<div class="user-msg">${escaped}</div>`;
    } else {
        chatBox.innerHTML += `<div class="bot-msg"><b>Medibot:</b><br>${escaped}</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;

    if(save){
        chatHistory.push({ role, content: text });
        saveChatHistory(chatHistory);
    }
}

const chatHistory = loadChatHistory();
(function restoreChatHistory(){
    const chatBox = document.getElementById("chatBox");
    if(chatHistory.length){
        chatBox.innerHTML = "";
        chatHistory.forEach(item => appendChatMessage(item.role, item.content, false));
    }
})();

async function sendMessage(){
    const input   = document.getElementById("userInput");
    const msg     = input.value.trim();
    if(!msg) return;

    input.value = "";
    appendChatMessage("user", msg);

    const tempId = "bot-" + Date.now();
    let thinking = msg.toLowerCase().includes("medicine") || msg.toLowerCase().includes("stock")
        ? "💊 Checking medicine availability..." : "🤖 MediBot is thinking...";
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML += `<div class="bot-msg" id="${tempId}"><i>${thinking}</i></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const res  = await fetch("http://127.0.0.1:5000/chat",{
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ message:msg, user_id:getUserId() })
        });
        const data = await res.json();
        const botDiv = document.getElementById(tempId);
        if(data.status === "success"){
            botDiv.innerHTML = "<b>Medibot:</b><br>" + escapeHtml(data.reply).replace(/\n/g,"<br>");
            chatHistory.push({ role: "assistant", content: data.reply });
            saveChatHistory(chatHistory);
        } else {
            botDiv.innerHTML = "⚠️ Error fetching response.";
        }
    } catch(err){
        const botDiv = document.getElementById(tempId);
        if(botDiv) botDiv.innerHTML = "❌ Connection Error: Make sure Flask server is running on port 5000.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("userInput").addEventListener("keypress", e => { if(e.key==="Enter") sendMessage(); });

function clearChatHistory(){
    if(confirm("Are you sure you want to clear the chat history? This cannot be undone.")){
        chatHistory.length = 0;
        saveChatHistory(chatHistory);
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = '<div class="bot-msg">👋 Hello! I am Medibot. I can check medicine stock, prices, and guide you on Medizy. How can I help?</div>';
    }
}
</script>
</body>
</html>

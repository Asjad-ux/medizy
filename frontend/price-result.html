<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medizy — Price Results</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('dashboard.html')">
    <div class="brand-icon"><img src="assets/logo.png" onerror="this.parentElement.textContent='＋'"></div>
    <div class="brand-text"><h2>Medizy</h2><p>AI-powered platform for accurate medicine information.</p></div>
  </div>
  <div class="topbar-actions">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="topSearch" placeholder="Search Medicine in Nearby Stores" autocomplete="off">
      <div class="autocomplete-dropdown" id="autocompleteDropdown">
        <div class="dropdown-header" id="dropdownHeader">Suggestions</div>
        <div id="dropdownList"></div>
      </div>
    </div>
    <button class="profile-btn" onclick="go('profile.html')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <button class="nav-item" onclick="go('dashboard.html')"><span class="nav-icon">🏠</span>Dashboard</button>
    <button class="nav-item" onclick="go('prescription-upload.html')"><span class="nav-icon">📋</span>Upload Prescription</button>
    <button class="nav-item" onclick="go('image-search.html')"><span class="nav-icon">🛡️</span>Authenticate Medicine</button>
    <button class="nav-item active" onclick="go('price-search.html')"><span class="nav-icon">💲</span>Price Compare</button>
    <button class="nav-item" onclick="go('chatbot.html')"><span class="nav-icon">🤖</span>Ask MediBot</button>
    <button class="nav-item" onclick="go('analytics.html')"><span class="nav-icon">📊</span>Analytics</button>
    <button class="nav-item" onclick="go('pharmacy-register.html')"><span class="nav-icon">🏪</span>Register Pharmacy</button>
    <button class="nav-item" onclick="go('about.html')"><span class="nav-icon">ℹ️</span>About</button>
    <div class="time-box">
      <div class="t-clock" id="clock">--:--:--</div>
      <div class="t-day" id="day">---</div>
      <div class="t-date" id="dateEl">---</div>
    </div>
  </div>

  <div class="content">
    <div class="page-header" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;">
        <h1>Price Results</h1>
        <p>Comparing prices across online resellers</p>
      </div>
      <div class="price-search-wrap" style="max-width:360px;">
        <input id="searchAgain" placeholder="Search again...">
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <div class="price-table-header">
      <span>Medicine Names</span>
      <span>Reseller Organization</span>
      <span>Price</span>
      <span>Visit</span>
    </div>

    <div id="results"></div>
  </div>
</div>

<script src="medizy.js"></script>
<script>
initSearch("topSearch");
startClock("clock","day","dateEl");

const params = new URLSearchParams(window.location.search);
const query = params.get("q") || localStorage.getItem("priceQuery") || "Paracetamol";
document.getElementById("searchAgain").value = query;
if (params.get("q")) {
    localStorage.setItem("priceQuery", query);
}

document.getElementById("searchAgain").addEventListener("keypress", function(e){
    if(e.key==="Enter"){ localStorage.setItem("priceQuery",this.value); location.reload(); }
});

async function fetchPrices(){
    const container = document.getElementById("results");
    try {
        const res  = await fetch(`http://localhost:3000/api/price?q=${query}`);
        const data = await res.json();
        container.innerHTML = "";
        if(!data||data.length===0){ container.innerHTML = '<p style="color:var(--text-muted);padding:16px;">No data found for this medicine.</p>'; return; }

        const prices  = data.map(d => parseInt((d.price||"").replace("₹",""))||9999);
        const minPrice= Math.min(...prices);

        data.forEach(item => {
            const priceVal  = parseInt((item.price||"").replace("₹",""))||9999;
            const cheapest  = priceVal === minPrice;
            container.innerHTML += `
            <div class="price-row">
                <span>${item.name||"—"}</span>
                <span>${item.store||"—"}</span>
                <span class="${cheapest?'cheapest':''}">${item.price||"—"}</span>
                <span>${item.link&&item.link!="#"?`<a href="${item.link}" target="_blank"><button>Go →</button></a>`:"—"}</span>
            </div>`;
        });
    } catch(err){
        document.getElementById("results").innerHTML = '<p style="color:var(--red);padding:16px;">⚠️ Error loading data. Make sure the server is running.</p>';
    }
}
fetchPrices();
</script>
</body>
</html>

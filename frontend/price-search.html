<!DOCTYPE html>
<html>
<head>
<title>Price Compare</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <div class="brand" onclick="go('dashboard.html')" style="cursor:pointer;">

        <img src="assets/logo.png">

        <div>
            <h2>Medizy</h2>
            <p>AI-powered platform that instantly provides accurate medicine information.</p>
        </div>

    </div>

    <div class="actions">
        <input placeholder="Search Medicines from Nearby Pharmacies">
        <div class="profile" onclick="go('profile.html')">👤</div>
    </div>

</div>

<!-- MAIN -->
<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <button onclick="go('prescription-upload.html')">Upload Prescription</button>
        <button onclick="go('image-search.html')">Authenticate Medicine</button>
        <button class="active" onclick="go('price-search.html')">Price Compare</button>
        <button onclick="go('chatbot.html')">Ask MediBot</button>
        <button onclick="go('pharmacy-register.html')">Register Your Pharmacy</button>
        <button onclick="go('about.html')">About</button>

        <div class="time-box" id="time"></div>

    </div>

    <!-- CONTENT -->
    <div class="content center-content">

        <div class="search-wrapper">
            <input id="priceSearch"
            placeholder="Search Medicines to compare price from online resellers">
            <span>🔍</span>
        </div>

    </div>

</div>

<script>
function go(page){
    window.location.href = page;
}

document.getElementById("priceSearch").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        localStorage.setItem("priceQuery", this.value);
        window.location.href = "price-result.html";
    }
});

// time
function updateTime(){
    const now = new Date();
    const day = now.toLocaleDateString(undefined, { weekday: 'long' });

    document.getElementById("time").innerText =
        now.toLocaleTimeString() + "\n" +
        day + "\n" +
        now.toLocaleDateString();
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>

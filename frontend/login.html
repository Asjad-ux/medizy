<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medizy — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>
<div class="auth-bg">
  <div class="auth-card-box">

    <div class="auth-logo">
      <img src="assets/logo.png" alt="Medizy" onerror="this.parentElement.textContent='＋'">
    </div>

    <h1>Welcome To Medizy</h1>
    <p class="auth-sub">AI-powered platform that instantly provides accurate medicine information and smarter healthcare guidance.</p>

    <div class="auth-login-label">Login</div>
    <small class="auth-login-sub">(If you are an Existing User)</small>

    <div class="auth-form-box">
      <div class="auth-input-row">
        <label>Email :</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="auth-input-row">
        <label>Password :</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="auth-btns">
        <button class="btn-secondary" onclick="go('signup.html')">New User</button>
        <button class="btn-primary" onclick="handleLogin()">Login →</button>
      </div>
    </div>

  </div>
</div>
<script src="medizy.js"></script>
<script src="script.js"></script>
</body>
</html>

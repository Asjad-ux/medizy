<!DOCTYPE html>
<html>
<head>
    <title>Analytics</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <div class="brand" onclick="go('dashboard.html')" style="cursor:pointer;">

        <img src="assets/logo.png">

        <div>
            <h2>Medizy</h2>
            <p>AI-powered platform that instantly provides accurate medicine information.</p>
        </div>

    </div>

    <div class="actions">
        <input id="search" placeholder="Search Medicines from Nearby Pharmacies">
        <div class="profile" onclick="go('profile.html')">👤</div>
    </div>

</div>

<!-- MAIN -->
<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <button onclick="go('prescription-upload.html')">Upload Prescription</button>
        <button onclick="go('image-search.html')">Authenticate Medicine</button>
        <button onclick="go('price.html')">Price Compare</button>
        <button onclick="go('chatbot.html')">Ask MediBot</button>
        <button onclick="go('pharmacy-register.html')">Register Your Pharmacy</button>
        <button onclick="go('about.html')">About</button>

        <div class="time-box" id="time"></div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <h1>Analytics</h1>
        <p class="subtitle">Insights & trends from user activity</p>

        <div class="cards">

            <!-- PIE CHART -->
            <div class="card">
                <h3>Medicine Category Distribution</h3>
                <canvas id="pieChart"></canvas>
            </div>

            <!-- BAR GRAPH -->
            <div class="card">
                <h3>Daily Medicine Searches</h3>
                <canvas id="barChart"></canvas>
            </div>

            <!-- EXTRA -->
            <div class="card big">
                <h3>Safety Score Distribution</h3>
                <canvas id="pie2"></canvas>
            </div>

            <div class="card big">
                <h3>Prescription vs Search Usage</h3>
                <canvas id="bar2"></canvas>
            </div>

        </div>

    </div>

</div>

<script>

// navigation
function go(page){
    window.location.href = page;
}

// search
document.getElementById("search").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        localStorage.setItem("searchQuery", this.value);
        window.location.href = "search.html";
    }
});

// time
function updateTime(){
    const now = new Date();
    const day = now.toLocaleDateString(undefined, { weekday: 'long' });

    document.getElementById("time").innerText =
        now.toLocaleTimeString() + "\n" +
        day + "\n" +
        now.toLocaleDateString();
}
setInterval(updateTime,1000);
updateTime();


// 📊 PIE CHART
new Chart(document.getElementById("pieChart"), {
    type: 'pie',
    data: {
        labels: ["Fever", "Pain", "Cold", "Other"],
        datasets: [{
            data: [30, 25, 20, 25],
            backgroundColor: ["#4CAF50","#2196F3","#FFC107","#FF5722"]
        }]
    }
});

// 📊 BAR CHART
new Chart(document.getElementById("barChart"), {
    type: 'bar',
    data: {
        labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
        datasets: [{
            label: "Search Count",
            data: [12,19,8,15,10,20,14],
            backgroundColor: "#2196F3"
        }]
    }
});

// EXTRA PIE
new Chart(document.getElementById("pie2"), {
    type: 'pie',
    data: {
        labels: ["Safe","Moderate","Risky"],
        datasets: [{
            data: [50,30,20],
            backgroundColor: ["green","orange","red"]
        }]
    }
});

// EXTRA BAR
new Chart(document.getElementById("bar2"), {
    type: 'bar',
    data: {
        labels: ["Prescription","Search"],
        datasets: [{
            label: "Usage",
            data: [40,60],
            backgroundColor: ["#673AB7","#009688"]
        }]
    }
});

</script>

</body>
</html>
